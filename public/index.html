<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Book Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="passcode-container">
        <h1>Enter Passcode</h1>
        <input type="password" id="passcode-input">
        <button onclick="checkPasscode()">Enter</button>
        <p id="error-message"></p>
    </div>

    <div id="gallery-container" style="display: none;">
        <header>
            <h1>Our Book Gallery</h1>
        </header>
        <main id="book-gallery">
            <!-- Book items will be injected here by JavaScript -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
